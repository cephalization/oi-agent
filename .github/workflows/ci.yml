name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: ${{ matrix.node }}
          cache: true
      - name: Format, lint and type-check
        run: vp check
      - name: Test
        run: vp test run
      - name: Build the CLI
        run: vp pack
        working-directory: packages/cli
      - name: Run the built CLI
        run: node packages/cli/dist/oi.mjs --help

  e2e:
    # The end-to-end scenarios that can run here: recorded model replies (no
    # keys), no Rex (terminal scenarios skip) and no sandbox-exec. The full
    # suite runs locally with `pnpm e2e`; see packages/e2e/README.md.
    name: End-to-end (replay)
    runs-on: ubuntu-latest
    services:
      phoenix:
        image: arizephoenix/phoenix:version-21.1.0
        ports:
          - 6006:6006
    env:
      OI_E2E_MODELS: replay
      OI_E2E_REX: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: 26
          cache: true
      - name: Wait for Phoenix
        run: timeout 60 sh -c 'until curl -sf http://localhost:6006/healthz; do sleep 2; done'
      - name: Run replayable scenarios
        run: vp test run --root packages/e2e
