name: Release

# On every push to main, Changesets either opens or updates a "chore: version
# packages" pull request from the pending .changeset/*.md files, or, when there
# are none left (that pull request was just merged), publishes any package
# whose version is not on npm yet, tags it and creates a GitHub release.
# Running the workflow by hand retries a failed publish: versions already on
# npm are skipped.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      pull-requests: write
      # Lets npm attach a provenance statement tying the package to this run.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      - name: Check and test
        run: vp check && vp test run
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm changeset version
          # pnpm publish runs the CLI's prepack (build, README, LICENSE) and
          # resolves workspace versions; publishConfig turns on provenance.
          publish-script: pnpm changeset publish
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
